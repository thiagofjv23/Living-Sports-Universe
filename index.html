<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Living Sports Universe</title>
    <!-- favicon vazio: evita o 404 automático de /favicon.ico -->
    <link rel="icon" href="data:," />
    <!--
      O "?v=N" é uma trava de cache: ao mudar o número a cada versão,
      o navegador (inclusive no celular) baixa o arquivo novo em vez de
      usar a cópia antiga guardada. Lembrete: incrementar N sempre que
      um destes arquivos for alterado.
    -->
    <link rel="stylesheet" href="css/style.css?v=23" />
  </head>
  <body>
    <header id="topo">
      <h1>Living Sports Universe</h1>
      <p>Uma enciclopédia viva de um universo esportivo simulado.</p>
      <p id="indicador-rodada">
        Temporada <strong id="ano-atual">2026</strong>
        · Rodada <strong id="rodada-atual">1</strong>
      </p>
    </header>

    <!-- Feed de notícias efêmeras: painel FIXO (fora da área principal,
         que é reescrita a cada navegação). Preenchido só via JS. -->
    <section id="feed-noticias"></section>

    <div id="layout">
      <!-- Menu Lateral (esquerda): botão de tempo + seções clicáveis. -->
      <nav id="menu-lateral">
        <button id="btn-avancar">▶ Avançar 1 Rodada</button>
        <h2>Competições</h2>
        <ul id="lista-competicoes"></ul>
        <h2>Atletas</h2>
        <ul id="lista-atletas"></ul>
        <h2>Organizações</h2>
        <ul id="lista-organizacoes"></ul>
        <p id="badge-metadados"></p>
      </nav>

      <!-- Página Principal (direita): a "Wikipédia" do atleta. -->
      <main id="pagina-principal">
        <p class="dica">← Selecione um atleta no menu para ver a página dele.</p>
      </main>
    </div>

    <!--
      Ordem de carregamento IMPORTANTE (dependências por variáveis globais):
      Núcleo lógico primeiro, depois o módulo esportivo, e por fim a interface.
    -->
    <script src="js/core/fabricaRegens.js?v=23"></script>
    <script src="js/core/fabricaOrganizacoes.js?v=23"></script>
    <script src="js/core/fabricaCompeticoes.js?v=23"></script>
    <script src="js/core/fabricaTemporadas.js?v=23"></script>
    <script src="js/core/fabricaContratos.js?v=23"></script>
    <script src="js/modulos-esportivos/moduloBasico.js?v=23"></script>
    <script src="js/core/eventBus.js?v=23"></script>
    <script src="js/core/memoriaHistorica.js?v=23"></script>
    <script src="js/core/ouvinteEstatisticas.js?v=23"></script>
    <script src="js/core/ouvinteSaude.js?v=23"></script>
    <script src="js/core/ouvinteContratos.js?v=23"></script>
    <script src="js/core/ouvinteRecordes.js?v=23"></script>
    <script src="js/core/gameLoop.js?v=23"></script>
    <script src="js/ui/ouvinteNoticias.js?v=23"></script>
    <script src="js/ui/renderizador.js?v=23"></script>
  </body>
</html>
